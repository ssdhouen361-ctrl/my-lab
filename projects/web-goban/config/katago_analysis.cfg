# KataGo Analysis Engine configuration for Web Goban
# Tuned for Apple M6 / 16GB Unified Memory with KaTrain coexistence
# Validated against KataGo v1.18.2 (Metal backend)

# --- Reporting & Rules ---
reportAnalysisWinratesAs = BLACK
assumeMultipleStartingBlackMovesAreHandicap = false
conservativePass = true
preventCleanupPhase = true
useEvalCache = false
nnRandomize = true
warnUnusedFields = true

# --- Metal GPU-only & Threading (2 x 8 = 16 threads, ~1.2-1.6GB RAM) ---
numNNServerThreadsPerModel = 1
metalDeviceToUseThread0 = 0
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

# --- Search Limits ---
maxVisits = 500
maxTime = 30
analysisPVLen = 15
wideRootNoise = 0.04

# --- Logging (relative to project root; engine also overrides logDir via CLI) ---
logDir = data/logs/katago
logToStderr = true
logAllRequests = false
logAllResponses = false
logErrorsAndWarnings = true
