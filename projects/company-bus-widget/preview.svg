  <text x="155" y="662" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">07:50</text>
  <text x="316" y="662" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="478" y="662" text-anchor="middle" fill="#38BDF8" font-family="Hiragino Sans, sans-serif" font-size="15" font-weight="bold">08:04</text>
  <text x="639" y="662" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">08:05</text>
  <text x="800" y="662" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">08:10</text>

  <!-- 行3 -->
  <rect x="74" y="674" width="808" height="36" fill="#0F172A"/>
  <text x="155" y="698" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">08:10</text>
  <text x="316" y="698" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="478" y="698" text-anchor="middle" fill="#38BDF8" font-family="Hiragino Sans, sans-serif" font-size="15" font-weight="bold">08:18</text>
  <text x="639" y="698" text-anchor="middle" fill="#64748B" font-family="Hiragino Sans, sans-serif" font-size="15">－</text>
  <text x="800" y="698" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">08:23</text>

  <!-- 行4 -->
  <rect x="74" y="710" width="808" height="36" fill="#1E293B"/>
  <text x="155" y="734" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">08:23</text>
  <text x="316" y="734" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="478" y="734" text-anchor="middle" fill="#38BDF8" font-family="Hiragino Sans, sans-serif" font-size="15" font-weight="bold">08:32</text>
  <text x="639" y="734" text-anchor="middle" fill="#64748B" font-family="Hiragino Sans, sans-serif" font-size="15">－</text>
  <text x="800" y="734" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">08:37</text>

  <!-- 行5 -->
  <rect x="74" y="746" width="808" height="36" fill="#0F172A"/>
  <text x="155" y="770" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">08:53</text>
  <text x="316" y="770" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="478" y="770" text-anchor="middle" fill="#38BDF8" font-family="Hiragino Sans, sans-serif" font-size="15" font-weight="bold">09:03</text>
  <text x="639" y="770" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">09:04</text>
  <text x="800" y="770" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">09:09</text>

  <!-- 行6 -->
  <rect x="74" y="782" width="808" height="36" fill="#1E293B"/>
  <text x="155" y="806" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">09:23</text>
  <text x="316" y="806" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="478" y="806" text-anchor="middle" fill="#38BDF8" font-family="Hiragino Sans, sans-serif" font-size="15" font-weight="bold">09:33</text>
  <text x="639" y="806" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">09:34</text>
  <text x="800" y="806" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">09:39</text>

  <!-- 行11 (13:50 京急のみ便の例) -->
  <rect x="74" y="818" width="808" height="36" fill="#0F172A"/>
  <text x="155" y="842" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">13:50</text>
  <text x="316" y="842" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="478" y="842" text-anchor="middle" fill="#64748B" font-family="Hiragino Sans, sans-serif" font-size="15">－</text>
  <text x="639" y="842" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="800" y="842" text-anchor="middle" fill="#64748B" font-family="Hiragino Sans, sans-serif" font-size="15">－</text>

  <!-- 行15 (17:30 夕方帰り便の例) -->
  <rect x="74" y="854" width="808" height="36" fill="#1E293B"/>
  <text x="155" y="878" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">17:30</text>
  <text x="316" y="878" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="478" y="878" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="639" y="878" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="800" y="878" text-anchor="middle" fill="#64748B" font-family="Hiragino Sans, sans-serif" font-size="15">－</text>

  <!-- 行25 (22:25 最終便の例) -->
  <rect x="74" y="890" width="808" height="36" fill="#0F172A"/>
  <text x="155" y="914" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">22:25</text>
  <text x="316" y="914" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">○</text>
  <text x="478" y="914" text-anchor="middle" fill="#38BDF8" font-family="Hiragino Sans, sans-serif" font-size="15" font-weight="bold">22:36</text>
  <text x="639" y="914" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">22:37</text>
  <text x="800" y="914" text-anchor="middle" fill="#E2E8F0" font-family="Hiragino Sans, sans-serif" font-size="15">22:42</text>

  <text x="478" y="965" text-anchor="middle" fill="#94A3B8" font-family="Hiragino Sans, sans-serif" font-size="15">（アプリ内では 07:15 〜 22:25 の全25便がスクロールで全て表示されます）</text>
</svg>
