<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1060" viewBox="0 0 960 1060">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D6EFD"/>
      <stop offset="100%" stop-color="#034EA2"/>
    </linearGradient>
    <clipPath id="cardClip1">
      <rect x="50" y="75" width="410" height="275" rx="38" ry="38"/>
    </clipPath>
    <clipPath id="cardClip2">
      <rect x="500" y="75" width="410" height="275" rx="38" ry="38"/>
    </clipPath>
  </defs>

  <!-- 全体背景 -->
  <rect width="960" height="1060" fill="#090D16"/>

  <!-- セクション1見出し -->
  <text x="50" y="46" fill="#F8FAFC" font-family="Hiragino Sans, -apple-system, sans-serif" font-size="22" font-weight="bold">① ホーム画面ウィジェット（2×2サイズ・改善後プレビュー）</text>

  <!-- ===== 左カード：JR発 ➔ GNFJ（往路） ===== -->
  <g clip-path="url(#cardClip1)">
    <rect x="50" y="75" width="410" height="275" rx="38" ry="38" fill="#111827"/>
    <!-- 上部ヘッダー（バスアイコン廃止・文字拡大・切替ボタン拡大） -->
    <rect x="50" y="75" width="410" height="62" fill="url(#headerGrad)"/>
    <text x="74" y="114" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="25" font-weight="bold">JR発 ➔ GNFJ</text>
    <!-- 大きくなった往復切替ボタン -->
    <rect x="338" y="88" width="104" height="36" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.24"/>
    <text x="390" y="112" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="19" font-weight="bold">⇄ 切替</text>

    <!-- メイン行：次発（便番号なし）＋カウントダウン -->
    <rect x="72" y="156" width="54" height="26" rx="8" ry="8" fill="#F97316"/>
    <text x="99" y="174" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">次発</text>
    <text x="136" y="175" fill="#CBD5E1" font-family="Hiragino Sans, sans-serif" font-size="19" font-weight="bold">07:31着</text>
    <text x="72" y="218" fill="#F8FAFC" font-family="Hiragino Sans, sans-serif" font-size="35" font-weight="bold">07:25発</text>

    <text x="436" y="171" text-anchor="end" fill="#CBD5E1" font-family="Hiragino Sans, sans-serif" font-size="15">発車まであと</text>
    <text x="436" y="218" text-anchor="end" fill="#FBBF24" font-family="Helvetica, Arial, sans-serif" font-size="39" font-weight="bold">12:34</text>

    <!-- 次々発・3本目ボックス（便番号を省き時刻が最後まで表示される） -->
    <rect x="70" y="238" width="370" height="92" rx="18" ry="18" fill="#1E293B"/>
    <text x="86" y="274" fill="#38BDF8" font-family="Hiragino Sans, sans-serif" font-size="17" font-weight="bold">次々発</text>
    <text x="150" y="274" fill="#F1F5F9" font-family="Hiragino Sans, sans-serif" font-size="19" font-weight="bold">08:04発 ➔ 08:10着</text>

    <text x="86" y="310" fill="#94A3B8" font-family="Hiragino Sans, sans-serif" font-size="17" font-weight="bold">3本目</text>
    <text x="150" y="310" fill="#CBD5E1" font-family="Hiragino Sans, sans-serif" font-size="19">08:18発 ➔ 08:23着</text>
  </g>
  <rect x="50" y="75" width="410" height="275" rx="38" ry="38" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- ===== 右カード：GNFJ発 ➔ 駅（復路・スクショと同じ時間帯の比較） ===== -->
  <g clip-path="url(#cardClip2)">
    <rect x="500" y="75" width="410" height="275" rx="38" ry="38" fill="#111827"/>
    <rect x="500" y="75" width="410" height="62" fill="url(#headerGrad)"/>
    <text x="524" y="114" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="25" font-weight="bold">GNFJ発 ➔ 駅</text>
    <rect x="788" y="88" width="104" height="36" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.24"/>
    <text x="840" y="112" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="19" font-weight="bold">⇄ 切替</text>

    <!-- メイン行 -->
    <rect x="522" y="156" width="54" height="26" rx="8" ry="8" fill="#F97316"/>
    <text x="549" y="174" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">次発</text>
    <text x="586" y="175" fill="#CBD5E1" font-family="Hiragino Sans, sans-serif" font-size="19" font-weight="bold">JR 07:25着</text>
    <text x="522" y="218" fill="#F8FAFC" font-family="Hiragino Sans, sans-serif" font-size="35" font-weight="bold">07:15発</text>

    <text x="886" y="171" text-anchor="end" fill="#CBD5E1" font-family="Hiragino Sans, sans-serif" font-size="15">発車まであと</text>
    <text x="886" y="218" text-anchor="end" fill="#FBBF24" font-family="Helvetica, Arial, sans-serif" font-size="39" font-weight="bold">4:58:23</text>

    <!-- 次々発・3本目ボックス（見切れていた JR 08:04着 / JR 08:18着 が完全表示！） -->
    <rect x="520" y="238" width="370" height="92" rx="18" ry="18" fill="#1E293B"/>
    <text x="536" y="274" fill="#38BDF8" font-family="Hiragino Sans, sans-serif" font-size="17" font-weight="bold">次々発</text>
    <text x="600" y="274" fill="#F1F5F9" font-family="Hiragino Sans, sans-serif" font-size="19" font-weight="bold">07:50発 ➔ JR 08:04着</text>

    <text x="536" y="310" fill="#94A3B8" font-family="Hiragino Sans, sans-serif" font-size="17" font-weight="bold">3本目</text>
    <text x="600" y="310" fill="#CBD5E1" font-family="Hiragino Sans, sans-serif" font-size="19">08:10発 ➔ JR 08:18着</text>
  </g>
  <rect x="500" y="75" width="410" height="275" rx="38" ry="38" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- セクション2見出し：アプリ内の全体時刻表 -->
  <text x="50" y="405" fill="#F8FAFC" font-family="Hiragino Sans, -apple-system, sans-serif" font-size="22" font-weight="bold">② アプリ本体画面（元の時刻表と同じ5列の全体時刻表を追加）</text>

  <!-- アプリ画面枠 -->
  <rect x="50" y="425" width="860" height="600" rx="24" ry="24" fill="#0F172A" stroke="#334155" stroke-width="2"/>

  <!-- アプリ内タブ -->
  <rect x="74" y="448" width="260" height="40" rx="12" ry="12" fill="#0D6EFD" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="204" y="474" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">JR発 ➔ GNFJ</text>

  <rect x="348" y="448" width="260" height="40" rx="12" ry="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="478" y="474" text-anchor="middle" fill="#94A3B8" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">GNFJ発 ➔ 駅</text>

  <rect x="622" y="448" width="260" height="40" rx="12" ry="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="752" y="474" text-anchor="middle" fill="#94A3B8" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">京急発 ➔ GNFJ</text>

  <!-- 表示モード切替ボタン -->
  <rect x="74" y="504" width="400" height="36" rx="10" ry="10" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="274" y="528" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="15" font-weight="bold">📊 時刻表全体（全便表）</text>

  <rect x="486" y="504" width="396" height="36" rx="10" ry="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
