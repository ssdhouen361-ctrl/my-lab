  <text x="155" y="581" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">GNFJ発</text>
  <text x="316" y="581" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">京急(降)</text>
  <text x="478" y="581" text-anchor="middle" fill="#FDE047" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">JR発</text>
  <text x="639" y="581" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">京急(乗)</text>
  <text x="800" y="581" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">GNFJ着</text>

