  <text x="639" y="625" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16">07:26</text>
  <text x="800" y="625" text-anchor="middle" fill="#FFFFFF" font-family="Hiragino Sans, sans-serif" font-size="16" font-weight="bold">07:31</text>

  <!-- 行2 -->
