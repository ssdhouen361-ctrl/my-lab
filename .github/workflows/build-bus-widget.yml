name: Build Company Bus Widget APK

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/company-bus-widget/**'
      - '.github/workflows/build-bus-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/company-bus-widget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk company-bus-widget.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: company-bus-widget-apk
          path: projects/company-bus-widget/company-bus-widget.apk
          overwrite: true

      - name: Publish APK to GitHub Releases (bus-widget-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bus-widget-latest
          name: "🚌 社バス カウントダウンウィジェット (最新版 APK)"
          body: |
            Galaxy S26 Ultra 用の社バスカウントダウンウィジェット（Home Up 自由リサイズ対応）です。
            下の **Assets** から `company-bus-widget.apk` をタップしてダウンロード・インストールしてください。
          files: projects/company-bus-widget/company-bus-widget.apk
          prerelease: false
