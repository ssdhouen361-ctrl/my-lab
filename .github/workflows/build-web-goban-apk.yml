name: Build Web Goban APK

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/web-goban/android/**'
      - '.github/workflows/build-web-goban-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/web-goban/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk web-goban.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-goban-apk
          path: projects/web-goban/android/web-goban.apk
          overwrite: true

      - name: Publish APK to GitHub Releases (web-goban-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-goban-latest
          name: "📱 AetherGo Android アプリ (最新版 APK)"
          body: |
            Galaxy S26 Ultra / Galaxy Tab S11 用の AI 囲碁アプリ「AetherGo」（最新版 APK）です。
            ブラウザのアドレスバーなし全画面・システム戻るジェスチャー連動・常時点灯に対応しています。
            下の **Assets** から `web-goban.apk` をタップしてダウンロード・インストールしてください。
          files: projects/web-goban/android/web-goban.apk
