name: Build TacTicTap Wear OS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/galaxy-watch-timer/**'
      - '.github/workflows/build-tactictap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/galaxy-watch-timer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/tactictap-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk tactictap.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactictap-wearos-apk
          path: projects/galaxy-watch-timer/tactictap.apk
          overwrite: true

      - name: Publish APK to GitHub Releases (tactictap-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tactictap-latest
          name: "⏱️ TacTicTap Wear OS (最新版 APK)"
          body: |
            Galaxy Watch 8 / Wear OS 用のブラインド・タップタイマー＆アラームアプリです。
            下の **Assets** から `tactictap.apk` をダウンロードしてウォッチへインストールしてください。
          files: projects/galaxy-watch-timer/tactictap.apk
